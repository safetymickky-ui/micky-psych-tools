<title>Learn</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="learning-map" content="learn-page">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+Thai:wght@400;600&display=swap">
<style>
/* Layout: a study map. Phone: the map list, then one map at a time with a back control. Wide: the list sits in a narrow column beside the open map. Each map reads top to bottom as before (the ladder), inside (pearls) and after (the path). Palette: Clinical Minimal (white page, one clinical-teal accent); the three ladder levels deepen the accent tint from foundations to what the material assumes. */
:root {
  --bg: #FFFFFF;
  --panel: #F5F7F8;
  --sunken: #ECEFF2;
  --line: #DCE2E6;
  --line-strong: #C3CCD3;
  --ink: #1B232B;
  --ink-2: #4A5561;
  --ink-3: #636E7A;
  --accent: #0E7C86;
  --accent-ink: #0B6A73;
  --accent-tint: #E8F4F5;
  --accent-100: #CDE7EA;
  --on-accent: #FFFFFF;
  --warn: #A15C07;
  --warn-tint: #FBF1E1;
  --lvl0: #F1F3F5;
  --lvl1: #E8F4F5;
  --lvl2: #D3EBEE;
  --edge: #B8C3CB;
  --font-ui: "Leelawadee UI", "Atkinson Hyperlegible", "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", Consolas, ui-monospace, "SFMono-Regular", Menlo, monospace;
  --step--1: 0.8125rem;
  --step-0: 1rem;
  --step-1: 1.1875rem;
  --step-2: 1.4375rem;
  --step-3: 1.75rem;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1519; --panel: #151D22; --sunken: #1B252B; --line: #26313A; --line-strong: #364450;
    --ink: #E3E9EC; --ink-2: #A9B4BB; --ink-3: #8A969E;
    --accent: #3DB1BA; --accent-ink: #6CC9D0; --accent-tint: #13292C; --accent-100: #1E4347; --on-accent: #0F1519;
    --warn: #E0A458; --warn-tint: #2E2414;
    --lvl0: #172026; --lvl1: #13292C; --lvl2: #1B3A3E; --edge: #3A4955;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1519; --panel: #151D22; --sunken: #1B252B; --line: #26313A; --line-strong: #364450;
  --ink: #E3E9EC; --ink-2: #A9B4BB; --ink-3: #8A969E;
  --accent: #3DB1BA; --accent-ink: #6CC9D0; --accent-tint: #13292C; --accent-100: #1E4347; --on-accent: #0F1519;
  --warn: #E0A458; --warn-tint: #2E2414;
  --lvl0: #172026; --lvl1: #13292C; --lvl2: #1B3A3E; --edge: #3A4955;
  color-scheme: dark;
}
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: var(--step-0);
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 56px;
}
.wrap { max-width: 1240px; margin-inline: auto; }
[hidden] { display: none !important; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; line-height: 1.25; }
p { margin: 0; }
a { color: var(--accent-ink); text-underline-offset: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--font-mono); font-size: 0.875em; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: var(--step--1); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; }
.muted { color: var(--ink-3); font-size: var(--step--1); }

.top {
  display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px;
  padding-block: 20px 16px; border-bottom: 1px solid var(--line); margin-bottom: 20px;
}
.top h1 { font-size: var(--step-2); font-weight: 700; letter-spacing: -0.01em; }
.top h1 .tick { color: var(--accent); }
.top .sub { color: var(--ink-3); font-size: var(--step--1); }

main[data-view="index"] #view-map { display: none; }
main[data-view="map"] #view-index { display: none; }

.back {
  display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 6px 0; margin-bottom: 8px;
  color: var(--accent-ink); cursor: pointer; font-size: var(--step--1); font-weight: 700;
}
.back:hover { text-decoration: underline; }

/* ---------- index ---------- */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 14px; }
.card {
  display: grid; gap: 8px; text-align: left; width: 100%; min-width: 0;
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; cursor: pointer;
}
.card:hover { border-color: var(--line-strong); }
.card.open { border-color: var(--accent); background: var(--accent-tint); }
.card h2 { font-size: var(--step-1); font-weight: 700; overflow-wrap: anywhere; }
.card .cite { color: var(--ink-2); font-size: 0.9375rem; overflow-wrap: anywhere; }
.counts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--step--1); color: var(--ink-3); }
.counts b { color: var(--ink); font-weight: 700; }
.counts .new b { color: var(--accent-ink); }
.empty { border: 1px dashed var(--line-strong); border-radius: var(--radius); padding: 20px; display: grid; gap: 10px; max-width: 640px; }
.empty h2 { font-size: var(--step-1); }
.empty p { color: var(--ink-2); }
.cmd {
  display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-self: start;
  font-family: var(--font-mono); font-size: 0.875rem; background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 6px 4px 10px; max-width: 100%;
}
.cmd code { overflow-wrap: anywhere; }
.copy {
  border: 1px solid var(--line-strong); background: var(--bg); border-radius: 4px; padding: 0 8px;
  font-family: var(--font-ui); font-size: var(--step--1); cursor: pointer; color: var(--accent-ink);
}
.example { opacity: 0.85; pointer-events: none; cursor: default; }
.example .eyebrow { color: var(--warn); }
.notice { color: var(--ink-2); max-width: 640px; }

/* ---------- chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px;
  font-size: var(--step--1); line-height: 1.6; background: var(--panel); color: var(--ink-2); border: 1px solid var(--line);
  white-space: nowrap;
}
.chip.accent { background: var(--accent-tint); color: var(--accent-ink); border-color: var(--accent-100); }
.chip.warn { background: var(--warn-tint); color: var(--warn); border-color: transparent; }
.chip.solid { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
button.chip { cursor: pointer; white-space: normal; text-align: left; }
button.chip:hover { border-color: var(--accent); color: var(--accent-ink); }
.you-new { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.you-brush { background: var(--warn-tint); color: var(--warn); border-color: transparent; }
.you-own { background: transparent; color: var(--ink-3); border-color: var(--line-strong); }

/* ---------- map ---------- */
.map-head { display: grid; gap: 8px; margin-bottom: 14px; }
.map-head h2 { font-size: var(--step-3); font-weight: 700; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.map-head .cite { color: var(--ink-2); overflow-wrap: anywhere; }
.gist { max-width: 68ch; font-size: 1.0625rem; color: var(--ink); border-left: 3px solid var(--accent); padding-left: 12px; }
.jump { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 6px; }
.jump button {
  border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 3px 12px; cursor: pointer;
  font-size: 0.9375rem; color: var(--ink-2);
}
.jump button:hover { border-color: var(--accent); color: var(--accent-ink); }
.jump b { color: var(--ink); font-variant-numeric: tabular-nums; }

.part { margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line); scroll-margin-top: 12px; }
.part-head { display: grid; gap: 4px; margin-bottom: 14px; }
.part-head h3 { font-size: var(--step-2); font-weight: 700; }
.part-head p { color: var(--ink-2); max-width: 68ch; }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-bottom: 12px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 0.9375rem; color: var(--ink-2); cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }

.diagram { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); margin-bottom: 18px; }
.diagram svg { display: block; }
.diagram .colhead { font-family: var(--font-ui); font-size: 11px; font-weight: 700; letter-spacing: 0.06em; fill: var(--ink-3); }
.diagram .node rect { stroke-width: 1; }
.diagram .node text { font-family: var(--font-ui); font-size: 12.5px; fill: var(--ink); }
.diagram .node { cursor: pointer; }
.diagram .n0 rect { fill: var(--lvl0); stroke: var(--line-strong); }
.diagram .n1 rect { fill: var(--lvl1); stroke: var(--accent-100); }
.diagram .n2 rect { fill: var(--lvl2); stroke: var(--accent); }
.diagram .nm rect { fill: var(--accent); stroke: var(--accent); }
.diagram .nm text { fill: var(--on-accent); font-weight: 700; }
.diagram .dot-new { fill: var(--accent); }
.diagram .dot-brush { fill: var(--warn); }
.diagram .dot-own { fill: none; stroke: var(--ink-3); stroke-width: 1.25; }
.diagram .edge { fill: none; stroke: var(--edge); stroke-width: 1.4; }
.diagram.selecting .node, .diagram.selecting .edge { opacity: 0.22; }
.diagram.selecting .node.on, .diagram.selecting .node.chain, .diagram.selecting .edge.chain { opacity: 1; }
.diagram .edge.chain { stroke: var(--accent); stroke-width: 2; }
.diagram .node.on rect { stroke-width: 2.5; }
.diagram .node.hidden-own { opacity: 0.35; }

.ladder { display: grid; gap: 6px; }
.band { border-radius: var(--radius); padding: 14px; display: grid; gap: 12px; }
.band.b0 { background: var(--lvl0); }
.band.b1 { background: var(--lvl1); }
.band.b2 { background: var(--lvl2); }
.band-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.band-head h4 { font-size: var(--step-1); font-weight: 700; }
.band-head p { color: var(--ink-2); font-size: 0.9375rem; }
.rise { display: flex; justify-content: center; color: var(--ink-3); font-size: var(--step--1); line-height: 1; }
.cap {
  display: flex; align-items: center; gap: 10px; border-radius: var(--radius); padding: 12px 14px;
  background: var(--accent); color: var(--on-accent); font-weight: 700;
}
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 10px; }
.item {
  display: grid; gap: 8px; align-content: start; min-width: 0;
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; cursor: pointer;
}
.item:hover { border-color: var(--line-strong); }
.item.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.ladder.selecting .item:not(.on):not(.chain) { opacity: 0.4; }
.item-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.item h5 { font-size: 1.0625rem; font-weight: 700; margin: 0; line-height: 1.3; overflow-wrap: anywhere; }
.item .field { font-size: var(--step--1); color: var(--ink-3); }
.mini { font-size: 0.75rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; }
.why { display: grid; gap: 2px; padding-top: 8px; border-top: 1px solid var(--line); }
.why .loc { color: var(--accent-ink); text-transform: none; letter-spacing: 0; font-family: var(--font-mono); font-size: 0.75rem; font-weight: 600; }
.links { display: grid; gap: 4px; }
.links .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.prose { overflow-wrap: anywhere; }
.prose code { font-family: var(--font-mono); font-size: 0.875em; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.hidden-note { font-size: var(--step--1); color: var(--ink-3); }

.pearls { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: none; }
.pearl {
  display: grid; grid-template-columns: 2.4rem minmax(0, 1fr); gap: 4px 12px; align-items: start;
  padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg);
}
.pearl.flash { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.pearl .n { font-size: var(--step-2); font-weight: 700; color: var(--accent-ink); line-height: 1.1; font-variant-numeric: tabular-nums; }
.pearl .body { display: grid; gap: 8px; min-width: 0; }
.pearl .txt { max-width: 70ch; }
.pearl .loc { font-family: var(--font-mono); font-size: 0.75rem; color: var(--ink-3); }

.route { list-style: none; margin: 0; padding: 0; display: grid; }
.stop { display: grid; grid-template-columns: 2.25rem minmax(0, 1fr); gap: 0 12px; }
.stop .rail { display: grid; grid-template-rows: auto 1fr; justify-items: center; }
.stop .dot {
  width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent); color: var(--on-accent); font-weight: 700; font-variant-numeric: tabular-nums;
}
.stop .line { width: 2px; background: var(--accent-100); margin-block: 4px; }
.stop:last-child .line { display: none; }
.stop .body { display: grid; gap: 8px; padding-bottom: 22px; min-width: 0; }
.stop h4 { font-size: var(--step-1); font-weight: 700; padding-top: 3px; overflow-wrap: anywhere; }
.stop .q { border-left: 3px solid var(--accent-100); padding: 6px 0 6px 12px; background: var(--accent-tint); border-radius: 0 6px 6px 0; max-width: 68ch; }
.stop .q p { font-weight: 700; color: var(--ink); }
.stop .why-next { max-width: 68ch; color: var(--ink-2); }
.foot { margin-top: 26px; padding-top: 12px; border-top: 1px solid var(--line); display: grid; gap: 8px; }

@media (min-width: 1040px) {
  main[data-view="map"] { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 36px; align-items: start; }
  main[data-view="map"] #view-index { display: block; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow-y: auto; padding-right: 4px; }
  main[data-view="map"] .cards { grid-template-columns: 1fr; gap: 8px; }
  main[data-view="map"] .card { padding: 12px; gap: 6px; }
  main[data-view="map"] .card h2 { font-size: 1rem; }
  main[data-view="map"] .card .cite, main[data-view="map"] .card .counts { display: none; }
  .phone-only { display: none !important; }
}
@media (prefers-reduced-motion: no-preference) {
  .card, .item, .pearl, .diagram .node, .diagram .edge { transition: opacity .15s ease, border-color .15s ease, background-color .15s ease; }
}
</style>

<div class="wrap">
  <header class="top">
    <h1>Learn<span class="tick">.</span></h1>
    <p class="sub" id="sub">Learning maps: what to know before a material, what to keep from it, where to go next</p>
  </header>

  <main id="app" data-view="index">
    <section id="view-index" aria-label="Maps">
      <div id="index-body"><p class="notice">Loading your maps…</p></div>
    </section>
    <section id="view-map" aria-label="Map">
      <button class="back phone-only" id="back" type="button">← All maps</button>
      <div id="map-body"></div>
    </section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
(function () {
  "use strict";
  var LS_LAST = "learn:last", LS_OWN = "learn:hide-owned";
  var SVGNS = "http://www.w3.org/2000/svg";
  var app = document.getElementById("app");
  var indexBody = document.getElementById("index-body");
  var mapBody = document.getElementById("map-body");
  var S = { snaps: new Map(), ready: false, open: null, sel: null, view: null, restored: false, hideOwned: lsGet(LS_OWN) === "1" };

  var LEVELS = {
    0: { name: "Level 0 · Foundations", note: "The base layer. Start here if the field is new." },
    1: { name: "Level 1 · Core", note: "Ideas the material's assumptions stand on." },
    2: { name: "Level 2 · Assumed here", note: "Used by the material without teaching them." }
  };
  var YOU = { "new": "New to you", brush: "Brush up", own: "Likely owned" };
  var PEARL_TYPE = { finding: "Finding", method: "Method", caveat: "Caveat", concept: "Concept", practice: "Practice" };
  var STEP_KIND = { deeper: "Deeper", wider: "Wider", apply: "Apply", challenge: "Challenge" };

  /* ---------- helpers ---------- */
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "text") n.textContent = attrs[k];
      else if (k === "class") n.className = attrs[k];
      else if (k === "on") Object.keys(attrs.on).forEach(function (ev) { n.addEventListener(ev, attrs.on[ev]); });
      else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c != null) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  function sv(tag, attrs, kids) {
    var n = document.createElementNS(SVGNS, tag);
    if (attrs) Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    (kids || []).forEach(function (c) { if (c != null) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  function str(v) { return typeof v === "string" ? v : (v == null ? "" : String(v)); }
  function arr(v) { return Array.isArray(v) ? v : []; }
  function obj(v) { return v && typeof v === "object" && !Array.isArray(v) ? v : {}; }
  function fmtDate(iso) {
    var s = str(iso);
    if (!/^\d{4}-\d{2}-\d{2}/.test(s)) return s;
    var d = new Date(s.slice(0, 10) + "T00:00:00");
    if (isNaN(d)) return s;
    try { return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }); } catch (e) { return s.slice(0, 10); }
  }
  function inline(text) {
    var src = str(text);
    try {
      if (window.marked && window.DOMPurify) {
        return window.DOMPurify.sanitize(window.marked.parseInline(src, { gfm: true }), { USE_PROFILES: { html: true } });
      }
    } catch (e) {}
    var p = document.createElement("span"); p.textContent = src; return p.innerHTML;
  }
  function prose(tag, cls, text) {
    var n = el(tag, { class: "prose" + (cls ? " " + cls : "") });
    n.innerHTML = inline(text);
    n.querySelectorAll("a[href]").forEach(function (a) {
      if (/^https?:\/\//i.test(a.getAttribute("href") || "")) { a.setAttribute("target", "_blank"); a.setAttribute("rel", "noopener noreferrer"); }
      else a.removeAttribute("href");
    });
    return n;
  }
  function copyText(text, btn) {
    function done(label) { btn.textContent = label; setTimeout(function () { btn.textContent = "Copy"; }, 1600); }
    function selectFallback() {
      var code = btn.parentNode.querySelector("code");
      if (code) { var r = document.createRange(); r.selectNodeContents(code); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
      done("Selected");
    }
    try { navigator.clipboard.writeText(text).then(function () { done("Copied"); }, selectFallback); } catch (e) { selectFallback(); }
  }
  function cmdBox(text) {
    var b = el("button", { class: "copy", type: "button", text: "Copy" });
    b.addEventListener("click", function () { copyText(text, b); });
    return el("span", { class: "cmd" }, [el("code", { text: text }), b]);
  }
  function setView(v) { app.setAttribute("data-view", v); }
  function wide() { return !!(window.matchMedia && window.matchMedia("(min-width: 1040px)").matches); }

  /* ---------- the map model ---------- */
  function model(raw) {
    var m = obj(raw), byId = new Map(), items = [];
    arr(m.ladder).forEach(function (it) {
      it = obj(it);
      var id = str(it.id), lv = Number(it.level);
      if (!id || byId.has(id) || [0, 1, 2].indexOf(lv) < 0) return;
      var x = { id: id, level: lv, name: str(it.name) || id, field: str(it.field), primer: str(it.primer), why: str(it.why),
                where: str(it.where), you: YOU[str(it.you)] ? str(it.you) : "", needs: arr(it.needs).map(str), neededBy: [] };
      byId.set(id, x); items.push(x);
    });
    items.forEach(function (x) {
      x.needs = x.needs.filter(function (n) { var y = byId.get(n); return y && y.level < x.level; });
      x.needs.forEach(function (n) { byId.get(n).neededBy.push(x.id); });
    });

  /* the dependency diagram: columns L0 | L1 | L2 | the material, edges point up the ladder */
  function renderDiagram(M) {
    var colW = 218, nodeW = 190, matW = 130, nodeH = 34, gap = 10, top = 34, padX = 14, padB = 14;

    }
    // level 2 keeps the material's order; each lower item sits level with the mean of the items that need it
    place(2);

      cols[lv] = cols[lv].map(function (x, k) {

      }).sort(function (a, b) { return a.key - b.key; }).map(function (o) { return o.x; });

      }
      var g = sv("g", { class: "node n" + x.level, transform: "translate(" + xOf(p.lv) + "," + (p.c - nodeH / 2) + ")" }, [
        sv("title", {}, [x.name + (x.you ? " · " + YOU[x.you] : "")]),
        sv("rect", { width: nodeW, height: nodeH, rx: 6, ry: 6 }),
        x.you ? sv("circle", { class: "dot-" + x.you, cx: 12, cy: nodeH / 2, r: 4 }) : null,
        sv("text", { x: x.you ? 22 : 10, y: nodeH / 2 + 4, "data-full": x.name, "data-max": String(nodeW - (x.you ? 30 : 18)) }, [x.name])

  /* shorten node labels to their box, measured once the diagram is on screen */

  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && S.sel) { S.sel = null; applySel(); } });
  window.addEventListener("hashchange", function () {
    var h = decodeURIComponent((location.hash || "").slice(1));
    if (h && S.snaps.has(h)) openMap(h, true);
  });

  function unavailable() {
    indexBody.textContent = "";
    indexBody.appendChild(el("div", { class: "empty" }, [
      el("h2", { text: "Maps are not available in this view" }),
      el("p", { text: "This page reads your maps from its own database, which opens only inside Claude while you are signed in. Open the page from your artifacts on claude.ai." })
    ]));
  }

  async function boot() {
    var db = null;
    try { db = (window.claude && typeof window.claude.use === "function") ? await window.claude.use("db") : null; } catch (e) { db = null; }
    if (!db) { unavailable(); return; }
    db.collection("maps").onSnapshot(function (snap) {
      var m = new Map();
      snap.docs.forEach(function (d) { if (d.exists) m.set(d.id, d); });
      var before = S.open ? S.snaps.get(S.open) : null;
      S.snaps = m; S.ready = true;
      if (!S.restored) {
        S.restored = true;
        var h = decodeURIComponent((location.hash || "").slice(1));
        var last = lsGet(LS_LAST);
        var pick = h && m.has(h) ? h : (last && m.has(last) && wide() ? last : null);
        renderIndex();
        if (pick) openMap(pick, false);
        return;
      }
      if (S.open && !m.has(S.open)) { closeMap(); return; }
      renderIndex();
      if (S.open && m.get(S.open) !== before) renderMap();
    }, function () {
      indexBody.textContent = "";
      indexBody.appendChild(el("p", { class: "notice", text: "Learn could not load its maps. Reload the page to try again." }));
    });
  }
  try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitLabels); } catch (e) {}
  boot();
})();
</script>
