<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backpropagation — one backward pass</title>
<!-- concept-lab worked example: guided walkthrough, computed mode.
     Model: 2-2-1 network, sigmoid units, squared-error loss, no biases.
     compute() runs the forward and backward pass; a step only decides what is shown. -->
<style>
  :root{
    --bg:#1f1a17; --panel:#2a2320; --panel2:#352c28; --line:#4d4139;
    --ink:#f3e9dc; --muted:#cdbba8; --faint:#a08e7e;
    --focus:#f0c36b; --data:#9cc3b1; --update:#e59572; --ok:#b3cf8a; --bad:#e57f6f;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html{color-scheme:dark; -webkit-text-size-adjust:100%}
  body{margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 var(--sans)}
  .wrap{max-width:560px; margin:0 auto; min-height:100svh;
    padding:12px 16px calc(84px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:10px}
  header{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
  h1{font:600 20px/1.2 var(--serif); margin:0}
  #count{color:var(--faint); font-size:14px; white-space:nowrap}
  .track{height:4px; border-radius:4px; background:var(--panel2); overflow:hidden}
  #fill{height:100%; width:0; border-radius:4px; background:var(--focus); transition:width .25s ease}

  .view{display:block; width:100%; aspect-ratio:4/3; max-height:44svh;
    background:var(--panel); border-radius:20px}
  .view text{font-family:var(--sans); font-size:15px; fill:var(--ink)}
  .view g{transition:opacity .25s ease}
  .dim{opacity:.28}
  .edge{stroke:var(--line); stroke-width:3; stroke-linecap:round; fill:none}
  .lit .edge{stroke:var(--muted)}
  .focus .edge{stroke:var(--focus); stroke-width:4.5}
  .glow{stroke:var(--focus); stroke-linecap:round; fill:none; opacity:.22}
  .node{fill:var(--panel2); stroke:var(--muted); stroke-width:2.5}
  .node.in{stroke:var(--data)}
  .focus .node{stroke:var(--focus); stroke-width:3.5}
  .halo{fill:none; stroke:var(--focus); stroke-width:3; opacity:.35; animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{50%{opacity:.08}}
  .view text.name{fill:var(--muted)}
  .view text.val{font-weight:600}
  .view text.w{fill:var(--muted)} .view text.g, .view text.d{fill:var(--update)}
  .view text.wn{fill:var(--ok)} .view text.aim{fill:var(--muted)}
  .lblbg{fill:var(--panel)}

  #status{background:var(--panel); border-radius:20px; padding:14px 16px; min-height:214px;
    display:flex; flex-direction:column; gap:8px}
  #status h2{font:600 19px/1.25 var(--serif); margin:0; display:flex; align-items:center; gap:10px}
  #status h2::before{content:""; flex:none; width:12px; height:12px; border-radius:50%;
    background:var(--focus); box-shadow:0 0 0 4px rgba(240,195,107,.2)}
  #status p{margin:0; font-size:15.5px; color:var(--ink)}
  #status .calc{align-self:flex-start; background:var(--panel2); color:var(--focus);
    border-radius:12px; padding:8px 12px; font-size:15px; font-variant-numeric:tabular-nums}
  #status .hint{color:var(--muted); font-size:14px}
  #status .src{color:var(--faint); font-size:13px}
  .cases{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .cases .hint{flex-basis:100%}

  button{font:inherit; color:var(--ink); cursor:pointer; touch-action:manipulation; border:0}
  button:focus-visible{outline:2px solid var(--focus); outline-offset:3px}
  .cases button{min-height:44px; min-width:44px; padding:8px 12px; font-size:14px;
    background:var(--panel2); border-radius:999px; box-shadow:inset 0 0 0 1.5px var(--line)}
  .cases button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--focus); color:var(--focus)}
  .bar{position:fixed; left:0; right:0; bottom:0; background:var(--bg);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
  .bar div{max-width:528px; margin:0 auto; display:flex; gap:10px}
  .bar button{min-height:52px; border-radius:999px; font-size:17px; font-weight:600}
  #prev{flex:0 0 104px; background:var(--panel2); color:var(--muted)}
  #prev:disabled{opacity:.4}
  #next{flex:1; background:var(--focus); color:#2a1f12}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Backpropagation</h1><span id="count"></span></header>
  <div class="track" aria-hidden="true"><div id="fill"></div></div>

  <svg id="view" class="view" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet" role="img"
    aria-label="A small neural network drawn left to right: two inputs, two hidden units, one output. The part that the current step explains is highlighted; the rest is dimmed."></svg>

  <section id="status" aria-live="polite"></section>
</div>
<nav class="bar"><div>
  <button id="prev">Back</button>
  <button id="next">Next</button>
</div></nav>

<script>
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const NS = "http://www.w3.org/2000/svg";
  const W1_BASE = [[0.5, -0.4], [0.3, 0.8]];     // W1[j][i]: input i -> hidden j
  const W2_BASE = [0.7, -0.6];                   // hidden j -> output
  const X2 = 0.5, LR = 0.5;
  const sig = (z) => 1 / (1 + Math.exp(-z));

  // ---------- state: the step, and the inputs of the current case ----------
  const S = { k:0, x1:1, y:1, sc:1, preset:"normal", m:null };

  // ---------- the model: the whole pass is computed here ----------
  function forward(W1, w2, x, y){
    const zh = W1.map(r => r[0]*x[0] + r[1]*x[1]), h = zh.map(sig);
    const zo = w2[0]*h[0] + w2[1]*h[1], yh = sig(zo);
    return { zh, h, zo, yh, L: 0.5*(yh - y)*(yh - y) };
  }
  function compute(){
    const x = [S.x1, X2], y = S.y;
    const W1 = W1_BASE.map(r => r.map(v => v*S.sc)), w2 = W2_BASE.map(v => v*S.sc);
    const { zh, h, zo, yh, L } = forward(W1, w2, x, y);
    const slopeO = yh*(1 - yh), slopeH = h.map(v => v*(1 - v));
    const dO = (yh - y) * slopeO;                           // blame at the output
    const g2 = h.map(hj => dO * hj);                        // dL/dw2_j
    const dH = h.map((_, j) => dO * w2[j] * slopeH[j]);     // blame at hidden j
    const g1 = dH.map(d => x.map(xi => d * xi));            // dL/dW1_ji
    const W1n = W1.map((r, j) => r.map((v, i) => v - LR*g1[j][i]));
    const w2n = w2.map((v, j) => v - LR*g2[j]);
    const Ln = forward(W1n, w2n, x, y).L;
    const flat = Math.hypot(...g2, ...g1.flat()) < 1e-9;
    S.m = { x, y, W1, w2, zh, h, zo, yh, L, slopeO, slopeH, dO, g2, dH, g1, W1n, w2n, Ln, flat };
  }

  // ---------- checks: read by verify.mjs, not shown ----------
  function checks(){
    const m = S.m, out = [], eps = 1e-5;
    let worst = 0, scale = 0;
    const fd = (bump) => {
      const p = (s) => { const W1 = m.W1.map(r => r.slice()), w2 = m.w2.slice(); bump(W1, w2, s*eps); return forward(W1, w2, m.x, m.y).L; };
      return (p(1) - p(-1)) / (2*eps);
    };
    for(let j=0;j<2;j++){
      const n2 = fd((W1, w2, e) => { w2[j] += e; });
      worst = Math.max(worst, Math.abs(n2 - m.g2[j])); scale = Math.max(scale, Math.abs(n2));
      for(let i=0;i<2;i++){
        const n1 = fd((W1, w2, e) => { W1[j][i] += e; });
        worst = Math.max(worst, Math.abs(n1 - m.g1[j][i])); scale = Math.max(scale, Math.abs(n1));
      }
    }
    const floor = 20 * Number.EPSILON * Math.max(1, m.L) / eps;
    out.push({ name:"all 6 backprop gradients vs finite difference (absolute)", pass: worst <= Math.max(1e-6*scale, floor), detail: worst.toExponential(1) });
    out.push({ name:"output stays inside 0–1", pass: m.yh > 0 && m.yh < 1 });
    const t = 1e-3;
    const Lt = forward(m.W1.map((r,j)=>r.map((v,i)=>v - t*m.g1[j][i])), m.w2.map((v,j)=>v - t*m.g2[j]), m.x, m.y).L;
    out.push({ name:"a tiny step against the gradient does not raise the loss", pass: m.flat || Lt <= m.L, detail: (m.L - Lt).toExponential(1) });
    out.push({ name:"all values finite", pass: [m.yh, m.L, m.dO, ...m.g2, ...m.dH, ...m.g1.flat(), m.Ln].every(Number.isFinite) });
    return out;
  }

  // ---------- number formatting ----------
  const neg = (s) => s.replace("-", "−");
  const f2 = (v) => neg(v.toFixed(2));
  const f3 = (v) => v === 0 ? "0" : (Math.abs(v) < 0.0005 ? neg(v.toExponential(0)) : neg(v.toFixed(3)));
  const par = (s) => s.startsWith("−") ? `(${s})` : s;      // (−0.40) inside a product

  // ---------- the steps ----------
  // focus: gets the highlight.  lit: shown at full strength.  everything else is dimmed.
  // label: which edges carry a label, and which number it is (w, g or wn).
  const E1 = ["e00","e01"], E2 = ["e10","e11"], EO = ["eo0","eo1"];
  const STEPS = [
    { focus:["x1","x2"], lit:[], label:{},
      title:"The inputs",
      body:() => `Two numbers go into the network. Think of them as two measurements of one case.`,
      hint:`The glowing part of the picture is what each card talks about. Tap Next to go on.` },
    { focus:E1, lit:["x1","x2","h1"], label:{ e00:"w", e01:"w" },
      title:"The weights",
      body:() => `Every line has a weight (w). It says how strongly one unit speaks to the next. Learning means changing these numbers.` },
    { focus:["h1"], lit:["x1","x2",...E1], label:{ e00:"w", e01:"w" },
      title:"Hidden unit h1",
      body:() => `It multiplies each input by its weight and adds them up. Then it squashes the sum into a number between 0 and 1.`,
      calc:(m) => `${f2(m.x[0])} × ${par(f2(m.W1[0][0]))} + ${f2(m.x[1])} × ${par(f2(m.W1[0][1]))} = ${f2(m.zh[0])}  →  squash  →  ${f3(m.h[0])}` },
    { focus:["h2"], lit:["x1","x2",...E2], label:{ e10:"w", e11:"w" },
      title:"Hidden unit h2",
      body:(m) => `It does the same job with its own two weights.` + (m.slopeH[1] < 0.02 ? ` Its sum is large, so the squash pushes it almost to 1.` : ``),
      calc:(m) => `${f2(m.x[0])} × ${par(f2(m.W1[1][0]))} + ${f2(m.x[1])} × ${par(f2(m.W1[1][1]))} = ${f2(m.zh[1])}  →  squash  →  ${f3(m.h[1])}` },
    { focus:["o"], lit:["h1","h2",...EO], label:{ eo0:"w", eo1:"w" },
      title:"The output",
      body:() => `The output unit does the same with h1 and h2. Its value ŷ is the network's answer. This was the forward pass.`,
      calc:(m) => `${f3(m.h[0])} × ${par(f2(m.w2[0]))} + ${f3(m.h[1])} × ${par(f2(m.w2[1]))} = ${f2(m.zo)}  →  squash  →  ${f3(m.yh)}` },
    { focus:["o"], lit:[], label:{}, aim:true,
      title:"The error",
      body:(m) => m.flat && Math.abs(m.yh - m.y) < 1e-9
        ? `The answer already equals the target, so the loss is 0. Watch what that does to the backward pass.`
        : `The answer should have been the target. The loss is one number that says how wrong it is. Now we go backward to find which weights caused it.`,
      calc:(m) => `loss = ½ × (${f3(m.yh)} − ${f2(m.y)})² = ${f3(m.L)}` },
    { focus:["o"], lit:[], label:{}, aim:true, delta:["o"],
      title:"Blame at the output",
      body:(m) => Math.abs(m.yh - m.y) < 1e-9
        ? `δ (delta) is the blame signal. The error is 0, so the blame is 0, and every step after this will give 0.`
        : `δ (delta) is the blame signal: the error times how steep the squash is at this unit. Backpropagation carries this number backward.`,
      calc:(m) => `δ = (${f3(m.yh)} − ${f2(m.y)}) × ${f3(m.slopeO)} = ${f3(m.dO)}` },
    { focus:EO, lit:["h1","h2","o"], label:{ eo0:"g", eo1:"g" }, delta:["o"],
      title:"Gradient of a weight",
      body:() => `One rule gives every gradient (g): the blame at the end of the line times the value at its start. The gradient says which way to move the weight.`,
      calc:(m) => `g = ${par(f3(m.dO))} × ${f3(m.h[0])} = ${f3(m.g2[0])}   (line from h1)` },
    { focus:["h1","h2"], lit:["o",...EO], label:{}, delta:["o","h1","h2"],
      title:"Blame travels back",
      body:(m) => { const j = m.slopeH.findIndex(s => s < 0.02);
        return `Each hidden unit gets a share of the output's blame: blame × the weight of its line × how steep its own squash is.` +
          (j >= 0 ? ` h${j+1} is almost ${m.h[j] > 0.5 ? 1 : 0}, where the squash is flat, so almost no blame gets through.` : ``); },
      calc:(m) => `δ of h1 = ${par(f3(m.dO))} × ${par(f2(m.w2[0]))} × ${f3(m.slopeH[0])} = ${f3(m.dH[0])}` },
    { focus:E1, lit:["x1","x2","h1"], label:{ e00:"g", e01:"g" }, delta:["h1"],
      title:"The same rule again",
      body:(m) => `Gradient = blame at the end × value at the start.` + (m.x[0] === 0 ? ` x1 is 0, so the weight on its line gets gradient 0: an input that sent nothing gets no blame.` : ` Here the end is h1 and the starts are x1 and x2.`),
      calc:(m) => `g = ${par(f3(m.dH[0]))} × ${f2(m.x[0])} = ${f3(m.g1[0][0])}   (line from x1)` },
    { focus:E2, lit:["x1","x2","h2"], label:{ e10:"g", e11:"g" }, delta:["h2"],
      title:"And for h2",
      body:() => `The same rule for the two lines that end at h2. Now every weight has its gradient. That is all backpropagation computes.`,
      calc:(m) => `g = ${par(f3(m.dH[1]))} × ${f2(m.x[0])} = ${f3(m.g1[1][0])}   (line from x1)` },
    { focus:[...E1,...E2,...EO], lit:[], label:{ e00:"wn", e01:"wn", e10:"wn", e11:"wn", eo0:"wn", eo1:"wn" },
      title:"The update",
      body:(m) => m.flat ? `Every gradient is 0, so no weight moves.` : `Each weight moves a small step against its gradient. The green numbers are the new weights.`,
      calc:(m) => `${f2(m.w2[0])} − 0.5 × ${par(f3(m.g2[0]))} = ${f3(m.w2n[0])}   (line from h1 to ŷ)` },
    { focus:["o"], lit:[], label:{}, aim:true, after:true, cases:true,
      title:"One pass, done",
      body:(m) => m.flat ? `The loss stays at ${f3(m.L)}. Nothing was wrong, so nothing changed.`
                         : `With the new weights the loss falls from ${f3(m.L)} to ${f3(m.Ln)}. Training repeats this pass many times.` },
  ];
  const LAST = STEPS.length - 1;

  // ---------- drawing ----------
  const P = { x1:[56,84], x2:[56,216], h1:[200,84], h2:[200,216], o:[336,150] };
  const EDGES = { e00:["x1","h1",128,72], e01:["x2","h1",150,128], e10:["x1","h2",150,178], e11:["x2","h2",128,238],
                  eo0:["h1","o",274,98], eo1:["h2","o",274,212] };       // from, to, label x, label y
  const DELTA_AT = { o:[354,204,"middle"], h1:[232,54,"start"], h2:[232,254,"start"] };
  const el = (tag, attrs, text) => { const e = document.createElementNS(NS, tag); for(const k in attrs) e.setAttribute(k, attrs[k]); if(text != null) e.textContent = text; return e; };

  function edgeNumber(id, kind, m){
    const j = id === "eo0" ? 0 : id === "eo1" ? 1 : +id[1], i = +id[2];
    const out = id[1] === "o";
    if(kind === "w")  return ["w",  "w " + f2(out ? m.w2[j] : m.W1[j][i])];
    if(kind === "g")  return ["g",  "g " + f3(out ? m.g2[j] : m.g1[j][i])];
    return ["wn", "w " + f2(out ? m.w2n[j] : m.W1n[j][i])];
  }
  function render(){
    const m = S.m, k = S.k, st = STEPS[k], svg = $("#view");
    const focus = new Set(st.focus), lit = new Set(st.lit);
    const cls = (id) => focus.has(id) ? "focus" : lit.has(id) ? "lit" : "dim";
    svg.textContent = "";

    for(const id in EDGES){
      const [a, b, lx, ly] = EDGES[id], g = el("g", { class: cls(id) });
      if(focus.has(id)) g.append(el("line", { class:"glow", "stroke-width":14, x1:P[a][0], y1:P[a][1], x2:P[b][0], y2:P[b][1] }));
      g.append(el("line", { class:"edge", x1:P[a][0], y1:P[a][1], x2:P[b][0], y2:P[b][1] }));
      svg.append(g);
    }
    for(const id in st.label){                      // labels only on the lines this step is about
      const [, , lx, ly] = EDGES[id], [c, text] = edgeNumber(id, st.label[id], m);
      svg.append(el("rect", { class:"lblbg", x:lx-34, y:ly-15, width:68, height:21, rx:8 }));
      svg.append(el("text", { class:c, x:lx, y:ly, "text-anchor":"middle" }, text));
    }
    const value = { x1:f2(m.x[0]), x2:f2(m.x[1]), h1: k >= 2 ? f3(m.h[0]) : "?", h2: k >= 3 ? f3(m.h[1]) : "?", o: k >= 4 ? f3(m.yh) : "?" };
    for(const id in P){
      const [x, y] = P[id], g = el("g", { class: cls(id) });
      if(focus.has(id)) g.append(el("circle", { class:"halo", cx:x, cy:y, r:34 }));
      g.append(el("circle", { class:"node" + (id[0] === "x" ? " in" : ""), cx:x, cy:y, r:26 }));
      g.append(el("text", { class:"name", x, y:y-36, "text-anchor":"middle" }, id === "o" ? "ŷ" : id));
      g.append(el("text", { class:"val", x, y:y+5, "text-anchor":"middle" }, value[id]));
      svg.append(g);
    }
    for(const id of (st.delta || [])){
      const [x, y, anchor] = DELTA_AT[id], d = id === "o" ? m.dO : m.dH[+id[1]-1];
      svg.append(el("text", { class:"d", x, y, "text-anchor":anchor }, "δ " + f3(d)));
    }
    if(st.aim){
      svg.append(el("text", { class:"aim", x:336, y:58, "text-anchor":"middle" }, "target " + f2(m.y)));
      svg.append(el("text", { class:"val", x:336, y:80, "text-anchor":"middle" }, "loss " + f3(st.after ? m.Ln : m.L)));
    }

    // the step card
    const card = $("#status"); card.textContent = "";
    const add = (tag, c, text) => { const e = document.createElement(tag); if(c) e.className = c; e.textContent = text; card.append(e); return e; };
    add("h2", "", st.title);
    add("p", "", st.body(m));
    if(st.calc) add("p", "calc", st.calc(m));
    if(st.hint) add("p", "hint", st.hint);
    if(st.cases){
      const row = add("div", "cases", "");
      const lead = document.createElement("span"); lead.className = "hint"; lead.textContent = "What if…"; row.append(lead);
      for(const [name, text] of [["right","Already right"],["zero","Zero input"],["big","Big weights"]]){
        const b = document.createElement("button"); b.dataset.preset = name; b.textContent = text;
        b.setAttribute("aria-pressed", String(S.preset === name));
        b.addEventListener("click", () => loadCase(name)); row.append(b);
      }
      add("p", "src", "Computed in this page. Toy network: one case, no biases.");
    }
    $("#count").textContent = `Step ${k+1} of ${STEPS.length}`;
    $("#fill").style.width = `${(k+1)/STEPS.length*100}%`;
    $("#prev").disabled = k === 0;
    $("#next").textContent = k === LAST ? "Start again" : "Next";
  }

  // ---------- moving through the steps ----------
  const go = (k) => { S.k = Math.max(0, Math.min(LAST, k)); render(); };
  $("#next").addEventListener("click", () => { if(S.k === LAST) loadCase("normal"); else go(S.k + 1); });   // "Start again" returns to the first case
  $("#prev").addEventListener("click", () => go(S.k - 1));
  document.addEventListener("keydown", (e) => {
    if(e.target.matches("button")) return;
    if(e.key === "ArrowRight" || e.key === " "){ e.preventDefault(); if(S.k < LAST) go(S.k + 1); }
    else if(e.key === "ArrowLeft"){ e.preventDefault(); go(S.k - 1); }
  });

  // ---------- "what if" cases: each jumps to the step where its effect first shows ----------
  const CASES = {
    normal: () => ({ x1:1, y:1, sc:1, at:0 }),
    right:  () => { Object.assign(S, { x1:1, sc:1 }); compute(); return { x1:1, y:S.m.yh, sc:1, at:5 }; },  // target = the answer it already gives
    zero:   () => ({ x1:0, y:1, sc:1, at:2 }),
    big:    () => ({ x1:1, y:1, sc:8, at:2 }),
  };
  function loadCase(name){
    const c = CASES[name]();
    Object.assign(S, { x1:c.x1, y:c.y, sc:c.sc, preset:name });
    compute(); go(c.at);
  }

  window.__lab = { mode:"computed", steps:STEPS.length, at:() => S.k, checks };
  compute(); render();
})();
</script>
</body>
</html>
